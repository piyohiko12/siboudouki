<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>志望動機メーカー｜進学・就職の志望動機づくり</title>
  <meta name="description" content="進学（大学・専門学校）と就職の両方に対応。質問に答えるだけで志望動機・志望理由書の下書きが作れるワークシートアプリ。">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191e29" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233558c4'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="header">
    <div class="header__inner">
      <span class="header__mark" aria-hidden="true">志</span>
      <div class="header__titles">
        <h1 id="appTitle">志望動機メーカー</h1>
        <p id="appSubtitle"></p>
      </div>
      <button type="button" id="resetBtn" class="btn btn--ghost" title="入力した内容をすべて消して、最初からやり直します">やり直す</button>
    </div>

    <div class="progress">
      <div class="progress__track"><i id="progressFill" class="progress__fill"></i></div>
      <div class="progress__meta">
        <span id="stepLabel"></span>
        <span id="saveIndicator" class="saveIndicator">保存しました</span>
      </div>
      <nav id="stepTabs" class="tabs" aria-label="ステップ移動"></nav>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="footer">
    <div class="footer__nav">
      <button type="button" id="prevBtn" class="btn btn--sub">戻る</button>
      <button type="button" id="nextBtn" class="btn btn--primary">次へ進む</button>
    </div>
    <p class="footer__note">入力内容はこのブラウザの中だけに自動保存されます。共用パソコンを使うときは、終わったら右上の「やり直す」か、提出画面の「入力した内容をすべて消す」を押してください。</p>
  </footer>

  <!-- 印刷専用（画面には表示されない） -->
  <div id="printArea" class="printArea" aria-hidden="true"></div>

  <script src="config.js"></script>
  <script src="assets/js/questions.js"></script>
  <script src="assets/js/compose.js"></script>
  <script src="assets/js/checklist.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
